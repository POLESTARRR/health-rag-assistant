name: Keep-alive

# Supabase's free tier pauses a project after about 7 days with no activity
# (it does not delete anything, but a paused project needs a manual click to
# wake back up). This just visits the live site every few days so it always
# looks active, well inside that window, with room to spare if a run or two
# gets skipped.
on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the live site
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://health-rag-assistant.onrender.com/)
          echo "Response status: $status"
          if [ "$status" -ge 500 ]; then
            echo "::warning::Site returned $status, may be worth checking manually."
          fi
